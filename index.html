<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Common Parts</title>
  <meta name="description" content="Index ouvert des pièces de rechange imprimables en 3D, classées par appareil. Open index of 3D-printable spare parts, organised by appliance." />
  <link rel="alternate" hreflang="fr" href="https://commonparts.org/fr/" />
  <link rel="alternate" hreflang="en" href="https://commonparts.org/en/" />
  <link rel="alternate" hreflang="x-default" href="https://commonparts.org/" />
  <link rel="icon" type="image/svg+xml" href="symbol.svg" />
  <script>
    // Language selection: explicit choice first, then the browser language. No geolocation.
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('cp-lang'); } catch (e) {}
      if (lang !== 'fr' && lang !== 'en') {
        var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        lang = /^fr\b/i.test(prefs[0] || '') ? 'fr' : 'en';
      }
      location.replace(lang + '/' + location.hash);
    })();
  </script>
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>

  <header>
    <div class="container">
      <a href="./" class="logo">
        <img src="symbol.svg" width="16" height="16" alt="" />
        Common Parts
      </a>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="container">
        <h1>Pièces de rechange imprimables, <em>classées par appareil.</em></h1>
        <p class="hero-sub" lang="en">Printable spare parts, organised by appliance.</p>
        <div class="lang-choice">
          <a href="fr/" hreflang="fr" class="btn-primary">Français</a>
          <a href="en/" hreflang="en" lang="en" class="btn-secondary">English</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <span class="footer-brand">Common Parts — 2026</span>
      <div class="footer-links">
        <a href="https://access.commonparts.org">Index</a>
        <a href="https://github.com/commonparts">GitHub</a>
        <a href="mailto:contact@commonparts.org">Contact</a>
      </div>
    </div>
  </footer>

</body>
</html>
